<!DOCTYPE html>
<html>

<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>Grattis Älskling</title>
<style>
body {
    text-align: center;
    background-color: #ffe6f0;
    font-family: Arial; 
}
button {
    font-size: 20px;
    padding: 15px 30px;
    display: block;
    margin: 20px auto;
    position: relative;
    z-index: 10;
}
img {
     width: 90%;
     max-width: 400px;
      border-radius: 15px;
}
.slide {
    opacity: 0;
    transition: opacity 1s ease;
    position: absolute;
    width: 100%;
}

.slide.active {
    opacity: 1;
    position: relative;
}
h1 {
    font-size: 28px;
}
h2 {
    font-size: 22px;
}
.slide:last-child h1 {
    font-size: 32px;
}
.hearts {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.heart {
    position: absolute;
    color: red;
    font-size: 24px;
    animation: floatUp 3s linear infinite;
}

@keyframes floatUp {
    0% {
        transform: translateY(100vh);
        opacity: 1;
    }
    100% {
        transform: translateY(-10vh);
        opacity: 0;
    }
}

</style>


</head>

<body>
    <div id="startScreen">
        <h2>Klicka här för en överraskning</h2>
    <button onclick="startSlideshow()"> Klicka här för kärlek! </button>
    <img src="Bild1.jpg" width="300">
    </div>
        <div id="slideshow" style="display: none;">

    <div class="slide">
        <h1>Grattis på födelsedagen </h1>
        <img src="Bild2.jpg">
    </div>

    <div class="slide">
        <h1>Jag älskar dig </h1>
        <img src="Bild3.jpg">
    </div>

    <div class="slide">
        <h1>Du betyder allt för mig </h1>
        <img src="Bild4.jpg">
    </div>
    <div class="slide">
    <h1>Jag älskar dig mest av allt </h1>
    <p>Hoppas du får världens bästa dag!</p>
    <img src="Bild5.jpg">
    <button onclick="restartSlideshow()">Börja om</button>
    </div>

    <button onclick="nextSlide()">Mer kärlek </button>
    <div class="hearts"></div>

</div>
    
    <script>

let currentSlide = 0;
const slides = document.getElementsByClassName("slide");
let heartInterval = null;

function startSlideshow() {
    document.getElementById("startScreen").style.display = "none";
    document.getElementById("slideshow").style.display = "block";

    slides[0].classList.add("active");
}

function nextSlide() {
    slides[currentSlide].classList.remove("active");

    currentSlide = currentSlide + 1;

    if (currentSlide === slides.length - 1 && !heartInterval) {
        heartInterval = setInterval(createHeart, 300);
    }

    slides[currentSlide].classList.add("active");

    // ändrar bakgrund
    const colors = ["#ffe6f0", "#e6f7ff", "#e6ffe6", "#fff0cc"];
    document.body.style.backgroundColor = colors[currentSlide];
    const nextButton = document.querySelector("#slideshow > button");

    if (currentSlide === slides.length - 1) {
        nextButton.style.display = "none";
    } else {
        nextButton.style.display = "block";
    }

}
function restartSlideshow() {
    slides[currentSlide].classList.remove("active");

    currentSlide = 0;

    slides[currentSlide].classList.add("active");

    document.body.style.backgroundColor = "#ffe6f0";
    clearInterval(heartInterval);
    heartInterval = null;
}
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (20 + Math.random() * 30) + "px";

    document.querySelector(".hearts").appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 3000);
}

</script>
</body>
</html>
